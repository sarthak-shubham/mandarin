services:
  redis:
    image: redis:7-alpine
    container_name: mochi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  mochi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mochi-server
    depends_on:
      - redis
    ports:
      - "8080:8080"
    environment:
      - MOCHI_REDIS_ADDRESS=redis:6379
      - MOCHI_SERVER_PORT=8080
      - MOCHI_WORKERS=10
      - MOCHI_DELIVERY_TIMEOUT=5s
    restart: unless-stopped

volumes:
  redis_data:
